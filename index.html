<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1E26">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>MatZ Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single reading column like a music-stand sheet; sticky control strip over the chart; bottom sheets for chord shapes. */
:root{
  --bg:#EEF0EA; --surface:#FFFFFF; --sunk:#E3E6DE; --ink:#19202B; --ink-2:#394150; --muted:#5F6674;
  --line:#D3D7CC; --chord:#2140B0; --chord-soft:#E2E7FA; --chorus:#8A5F00; --danger:#B42318; --on-chord:#FFFFFF; --mark:#C4241C; --medley:#1C7A44; --p1:#F2C230; --p2:#2F7BE8; --p3:#E8513A; --p4:#2FBF86; --veil:rgb(238 240 234 / .84); --veil-calm:rgb(238 240 234 / .93); --photo:none; --tshadow:none;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --lyric:19px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141A; --surface:#1A1E26; --sunk:#232833; --ink:#F8F8F3; --ink-2:#DFE1DB; --muted:#B7BCC6;
  --line:#2D333E; --chord:#AEBFFF; --chord-soft:#243058; --chorus:#E4B54A; --danger:#FF8D7E; --on-chord:#10142A; --mark:#FF8F85; --medley:#74E2A4; --veil:rgb(17 20 26 / .74); --veil-calm:rgb(17 20 26 / .88); --tshadow:1px 0 0 rgb(0 0 0 / .7), -1px 0 0 rgb(0 0 0 / .7), 0 1px 0 rgb(0 0 0 / .7), 0 -1px 0 rgb(0 0 0 / .7), 0 2px 8px rgb(0 0 0 / .8); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1E26; --sunk:#232833; --ink:#F8F8F3; --ink-2:#DFE1DB; --muted:#B7BCC6;
  --line:#2D333E; --chord:#AEBFFF; --chord-soft:#243058; --chorus:#E4B54A; --danger:#FF8D7E; --on-chord:#10142A; --mark:#FF8F85; --medley:#74E2A4; --veil:rgb(17 20 26 / .74); --veil-calm:rgb(17 20 26 / .88); --tshadow:1px 0 0 rgb(0 0 0 / .7), -1px 0 0 rgb(0 0 0 / .7), 0 1px 0 rgb(0 0 0 / .7), 0 -1px 0 rgb(0 0 0 / .7), 0 2px 8px rgb(0 0 0 / .8); color-scheme:dark }

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);text-shadow:var(--tshadow);font-family:var(--f-body);font-size:16px;line-height:1.45}
/* Background photo, dimmed by a veil in the theme's colors; stronger while reading a song. */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--veil),var(--veil)),var(--photo) center 35%/cover no-repeat}
body.calm::after{background:linear-gradient(var(--veil-calm),var(--veil-calm)),var(--photo) center 35%/cover no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:16px 120px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--chord);outline-offset:2px;border-radius:4px}
code,kbd{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:.05em .35em;border-radius:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary,.chip,.sheet,#toast,.k-lbl{text-shadow:none}
.btn.primary{background:var(--chord);border-color:var(--chord);color:var(--on-chord)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon{width:40px;height:40px;border-radius:999px;display:inline-grid;place-items:center;font-size:1.5rem;line-height:1;color:var(--ink-2)}
.icon:hover{background:var(--sunk)}

/* app header */
.appbar{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
/* Header: a string of party pennants like the bunting in the photo, a small lead-in, and the name in display type. */
.pennants{height:18px;margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));border-top:1.5px solid var(--line);
  background:linear-gradient(90deg,var(--p1) 0 25%,var(--p2) 25% 50%,var(--p3) 50% 75%,var(--p4) 75%) 0 0/104px 100%;
  -webkit-mask:conic-gradient(from -28deg at 50% 100%,#000 56deg,#0000 0) 0 0/26px 100%;mask:conic-gradient(from -28deg at 50% 100%,#000 56deg,#0000 0) 0 0/26px 100%;opacity:.9}
.brand{padding-block:14px 10px;text-align:center}
.brand .kicker{display:block;font-family:var(--f-mono);font-weight:600;font-size:1.15rem;letter-spacing:.12em;margin-right:-.12em;text-transform:uppercase;color:var(--muted)}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,7vw,3.1rem);letter-spacing:-.035em;line-height:.95;color:var(--ink);margin-top:4px}
.brand .live{background:linear-gradient(95deg,var(--chord) 10%,var(--medley) 55%,var(--p1) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--chord) 45%,transparent));padding-right:.06em}
.tabs{display:flex;gap:4px}
.tab{padding:10px 4px 12px;margin-right:18px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--chord)}
.tab .n{font-family:var(--f-mono);font-size:.8em;font-weight:500;margin-left:.35em;color:var(--muted)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:56px}
.tb-title{flex:1;min-width:0}
.tb-title .t1{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.15;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .t2{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* library */
.row-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:0;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px}
@media (max-width:520px){.row-tools{flex-wrap:wrap}.row-tools .search{flex-basis:100%}}
.songs{list-style:none;margin:0;padding:0;display:grid}
.song-row{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.song-row:hover .sr-title{color:var(--chord)}
.medley,.song-row:hover .sr-title.medley{color:var(--medley)}
.sr-title{font-weight:700;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-sub{grid-column:1;font-size:.86rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-sub .cs{font-family:var(--f-mono);color:var(--chord);font-size:.95em}
.sr-key{grid-row:1/span 2;grid-column:2;font-family:var(--f-mono);font-weight:600;font-size:.9rem;min-width:44px;text-align:center;padding:6px 8px;border-radius:8px;background:var(--sunk);color:var(--ink-2)}
.backup{margin-top:28px}.backup .status{margin-top:0}
.status{margin-top:28px;font-size:.84rem;color:var(--muted);max-width:60ch}
.empty{padding:40px 4px;max-width:52ch}
.empty-t{font-family:var(--f-display);font-weight:800;font-size:1.4rem;margin:0 0 6px;letter-spacing:-.015em}
.empty p{margin:0 0 16px;color:var(--ink-2)}

/* song view controls */
.controls{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.grp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-height:40px}
.grp>button{min-width:40px;height:38px;padding:0 10px;font-weight:700;font-size:1.05rem}
.grp>button:first-child{border-radius:999px 0 0 999px}.grp>button:last-child{border-radius:0 999px 999px 0}
.grp>button:hover{background:var(--sunk)}
.tr-val{font-family:var(--f-mono);font-weight:600;font-size:.92rem;padding:0 4px;min-width:5.4em;text-align:center;font-variant-numeric:tabular-nums}
.tr-val .lbl{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem}
.tr-val small{color:var(--chord);font-size:.8rem}
.sel{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:700;font-size:.9rem;max-width:100%}
#speed{width:110px;accent-color:var(--chord)}

.used{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 22px}
.keynote{margin:-10px 0 20px;font-size:.92rem;color:var(--ink-2);padding:8px 12px;background:var(--sunk);border-radius:8px;max-width:62ch}
.keynote .lbl{text-transform:uppercase;font-size:.72rem;letter-spacing:.08em;color:var(--chorus);margin-right:6px;font-weight:700}
.keyhint{margin:-6px 0 14px;font-size:.85rem}
.used .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.chip{font-family:var(--f-mono);font-weight:600;font-size:.9rem;padding:5px 10px;border-radius:8px;background:var(--chord-soft);color:var(--chord);border:0}
.chip:hover{outline:1px solid var(--chord)}
.chip.plain{background:var(--sunk);color:var(--ink-2)}

/* the chart */
.chart{font-size:var(--lyric);line-height:1.3;overflow-wrap:anywhere}
.sec{margin:0 0 1.15em}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:.3em;flex-wrap:wrap}
.sec-label{font-family:var(--f-display);font-weight:600;font-size:max(.62em,12px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k-chorus{padding-left:1.1em}
.k-mpart{margin-top:1.8em;padding-top:.7em;border-top:2px solid var(--line)}
.chart>.k-mpart:first-child{margin-top:0;padding-top:0;border-top:0}
.k-mpart .sec-label{font-family:var(--f-display);font-weight:800;font-size:max(.95em,17px);letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.mparts{display:inline-block;margin-top:6px}
.pparts{flex-basis:100%;padding:4px 0 10px 2.6em}
.pparts .hint{margin:0 0 8px;font-size:.85rem}
.pchip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:100%;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pchip b{font-size:.88rem;text-decoration:line-through}
.pchip small{font-size:.78rem;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip[aria-pressed="true"]{background:var(--chord-soft);border-color:var(--chord);color:var(--ink)}
.pchip[aria-pressed="true"] b{text-decoration:none;color:var(--chord)}
.sec-note{font-size:max(.62em,12px);color:var(--muted);font-style:italic}
.sl div.open{padding:8px 6px;font-weight:700}
.mgrp{min-height:36px;flex:none}.mgrp>button{min-width:34px;height:34px;padding:0 6px}
.k-chorus .sec-label{color:var(--chorus)}
.ln{white-space:pre-wrap;min-height:1.3em}
.ln.wc{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:.2em;white-space:normal;margin-top:.15em}
.seg{display:inline-flex;flex-direction:column}
.ly{white-space:pre-wrap}
.seg[data-split] .ly{display:flex}
.dash{flex:1 0 0;min-width:0;overflow:hidden;text-align:center;color:var(--muted)}
.ch{font-family:var(--f-mono);font-weight:600;font-size:.84em;line-height:1.5;color:var(--chord);padding:0 .5em 0 0;white-space:nowrap;text-align:left;border-radius:4px}
button.ch:hover{background:var(--chord-soft)}
.ch.mark{color:var(--mark)}
.chart.edit .ch.mark.on{background:var(--mark);color:var(--on-chord)}
.ch.nc{color:var(--muted);font-weight:500}
.ch.ph{visibility:hidden}
.chordsonly{display:flex;flex-wrap:wrap;gap:.2em .9em;margin-top:.15em}
.gap{height:.75em}

/* editing the chart */
.chart.edit .c{cursor:text;border-radius:2px}
.chart.edit .c:hover{background:var(--chord-soft)}
.chart.edit .ch.on{background:var(--chord);color:var(--on-chord);padding-left:.25em}
.addend{color:var(--muted);font-family:var(--f-mono);font-size:.8em;padding:0 .35em;margin-left:.15em;border:1px dashed var(--line);border-radius:4px;cursor:pointer;opacity:.7}
.addend:hover{opacity:1;color:var(--chord)}
.sec-tools{display:inline-flex;gap:4px}
.mini{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.mini:hover{border-color:var(--chord);color:var(--chord)}

.fields{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px;margin-bottom:16px}
@media (max-width:560px){.fields{grid-template-columns:1fr 1fr}.fields .f-title{grid-column:1/-1}}
.field label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;min-width:0}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:12px}
.seg-ctl button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tapbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px 4px;margin-bottom:6px}
.tapbar .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tapbar .seg-ctl{margin-bottom:0}
.sb-tip{font-size:.82rem;color:var(--chord);font-weight:700;padding-top:8px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 14px;max-width:62ch}
.tt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tt .lbl{font-size:.8rem;color:var(--muted)}
.tt .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.tt .btn{min-height:36px;padding:0 12px;font-size:.85rem}
textarea#body{width:100%;min-height:55vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;font-family:var(--f-mono);font-size:15px;line-height:1.55;resize:vertical;tab-size:4}
details.help{margin-top:12px;color:var(--ink-2);font-size:.9rem}
details.help summary{cursor:pointer;color:var(--muted);font-weight:700}
details.help ul{padding-left:1.2em;margin:.5em 0}
.danger-zone{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;font-weight:700}
.confirm-band{background:var(--sunk);border-bottom:1px solid var(--line)}

.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px rgb(0 0 0 / .08)}
.sb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:10px}
.sb-chord{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;color:var(--chord);min-width:3.5em}
.sb .btn{min-height:38px;padding:0 12px}

/* setlists */
.sl-name{width:100%;font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;border:0;border-bottom:2px dashed var(--line);background:none;padding:4px 0;margin-bottom:14px}
.sl-name:focus{outline:none;border-bottom-color:var(--chord)}
.sl{list-style:none;margin:0 0 16px;padding:0;counter-reset:n}
.sl li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:6px 0}
.sl .num{font-family:var(--f-mono);color:var(--muted);width:2.2em;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.sl .open{flex:1;min-width:0;text-align:left;padding:8px 6px;font-weight:700}
.sl div.open{flex:1;min-width:0}
.openbtn{display:block;width:100%;text-align:left;font-weight:700}
.openbtn small{display:block;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .open small{display:block;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .icon{width:36px;height:36px;font-size:1.05rem}
.set-row{width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);display:block}
.set-row b{display:block;font-size:1.05rem}
.set-row span{font-size:.86rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
.playnav .btn{max-width:42%;overflow:hidden;text-overflow:ellipsis}
.playnav .pos{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
.setbadge{font-size:.78rem;color:var(--chord);font-weight:700}

/* bottom sheet */
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgb(10 12 18 / .45)}
.sheet{position:relative;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;width:100%;max-width:560px;margin:0 auto;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgb(0 0 0 / .2)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 8px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-h h2{flex:1;margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.big-chord{flex:1;font-family:var(--f-mono);font-weight:600;font-size:2rem;color:var(--chord);line-height:1.1}
.inst{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.inst button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:.85rem}
.inst button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tuning{font-size:.82rem;color:var(--muted);margin-bottom:6px;font-family:var(--f-mono)}
.dgm-box{display:grid;place-items:center;padding:6px 0;min-height:200px}
.dgm{width:100%;max-width:240px;height:auto}
.dgm.piano{max-width:480px}
.d-line{stroke:var(--ink-2);stroke-width:1.2;fill:none}
.d-fret{stroke:var(--line);stroke-width:1.5;fill:none}
.d-nut{fill:var(--ink)}
.d-dot{fill:var(--chord)}
.d-fn{fill:var(--on-chord);font:600 12px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.d-mark{fill:var(--muted);font:600 13px var(--f-mono);text-anchor:middle}
.d-open{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d-note{fill:var(--muted);font:500 11px var(--f-mono);text-anchor:middle}
.d-base{fill:var(--ink-2);font:600 12px var(--f-mono);text-anchor:end}
.k-w{fill:var(--surface);stroke:var(--ink-2);stroke-width:1}
.k-b{fill:var(--ink);stroke:var(--ink);stroke-width:1}
.k-on{fill:var(--chord);stroke:var(--ink-2)}
.k-bass{fill:var(--chorus);stroke:var(--ink-2)}
.k-lbl{font:600 10px var(--f-mono);text-anchor:middle;fill:var(--on-chord)}
.vnav{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}
.vnav span{font-size:.9rem;color:var(--ink-2);min-width:11em;text-align:center}
.notes{text-align:center;font-family:var(--f-mono);color:var(--ink-2);font-size:.92rem}
.notes .lbl{font-family:var(--f-body);color:var(--muted);font-size:.8rem}
.pick-form{display:flex;gap:8px}
.pick-form input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 14px;font-family:var(--f-mono);font-size:1.15rem;font-weight:600}
.pick-hint{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:8px 2px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.add-list{list-style:none;margin:10px 0 0;padding:0}
.add-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.add-list li span{flex:1;min-width:0}
.pchip.opt b{text-decoration:none}
.imp-list{max-height:58vh;overflow:auto;margin:0 -4px;padding:0 4px}
.imp-g{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.imp-gh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.imp-gh b{font-size:.95rem}.imp-gh .n{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.imp-gh small{display:block;color:var(--muted);font-size:.8rem}
.imp-all{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.imp-all span{font-size:.78rem;color:var(--muted)}
.imp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:0}
.imp-t{flex:1 1 180px;min-width:0;font-weight:700}
.imp-t small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.imp-seg{margin:0}.imp-seg button{padding:6px 11px;font-size:.82rem}
.pdf-h{display:flex;align-items:center;gap:6px}.pdf-h .lbl{flex:1}
.sheet .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pdf-list{max-height:42vh;overflow:auto;margin-top:4px}
.pdf-list li{padding:0}
.pdf-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 2px;color:var(--muted)}
.pdf-row[aria-pressed="true"]{color:var(--ink)}
.pdf-row .tick{width:24px;height:24px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:6px;font-weight:700;color:var(--on-chord)}
.pdf-row[aria-pressed="true"] .tick{background:var(--chord);border-color:var(--chord)}
.pdf-row span:last-child{flex:1;min-width:0}
.pdf-row small{font-size:.75rem;font-weight:700}
.add-list small{display:block;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.92rem;max-width:min(90vw,460px);text-align:center;box-shadow:0 8px 30px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>

<div id="sheetWrap" hidden><div class="scrim" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

// ---------- ChordPro parsing ----------
function parseLine(line, base) {
  const segs = []; const re = /\[([^\]\n]*)\]/g; let m, last = 0;
  let c = { c: null, co: -1, x: '', xo: base };
  while ((m = re.exec(line))) {
    c.x += line.slice(last, m.index); segs.push(c);
    c = { c: m[1], co: base + m.index, x: '', xo: base + m.index + m[0].length };
    last = re.lastIndex;

}
function parseSong(text) {
  const lines = text.split('\n'); let off = 0; const items = [];
  for (const line of lines) {
    const start = off; off += line.length + 1;
    const t = line.trim();
    const dm = t.match(/^\{\s*([A-Za-z_]+)\s*(?::\s*([^}]*))?\}$/);
    if (dm) {
      const d = dm[1].toLowerCase(), arg = (dm[2] || '').trim();
      if (d === 'soc' || d === 'start_of_chorus') items.push({ t: 'sec', kind: 'chorus', label: arg || 'Chorus', start });
      else if (d === 'sov' || d === 'start_of_verse') items.push({ t: 'sec', kind: 'verse', label: arg || 'Verse', start });
      else if (d === 'sob' || d === 'start_of_bridge') items.push({ t: 'sec', kind: 'bridge', label: arg || 'Bridge', start });
      else if (/^(eoc|eov|eob|end_of_)/.test(d)) items.push({ t: 'end', start, next: off });
      else if (d === 'medley_part') { const [lab, note] = arg.split('||'); items.push({ t: 'sec', kind: 'mpart', label: lab.trim(), note: (note || '').trim(), start }); }

    if (t.startsWith('#')) continue;

}

// ---------- chart rendering ----------
function chordBtn(seg, o) {

}
function chars(str, off) {
  let h = '', i = off;

function renderLine(it, o) {
  const segs = it.segs;
  const hasChord = segs.some(s => s.c !== null);
  const addEnd = o.edit ? `<span class="addend" data-act="ins" data-o="${it.end}" title="Add a chord at the end of the line">+</span>` : '';
  if (!hasChord) return `<div class="ln">${o.edit ? chars(segs[0].x, segs[0].xo) : esc(segs[0].x)}${addEnd}</div>`;
  if (!o.edit && segs.every(s => s.x.trim() === '')) return `<div class="ln chordsonly">${segs.filter(s => s.c !== null).map(s => chordBtn(s, o)).join('')}</div>`;

      const last = (p || prev).slice(-1);

// ---------- diagrams ----------
function fretSVG(v, inst, flats, name) {
  const T = inst.tuning, n = T.length, fr = v.fr;
  const fd = fr.filter(f => f > 0);
  const maxF = fd.length ? Math.max(...fd) : 0, minF = fd.length ? Math.min(...fd) : 0;
  const base = maxF <= 4 ? 1 : minF;
  const rows = Math.max(4, maxF - base + 1);
  const gap = n === 4 ? 36 : 28, left = 36, top = 34, fh = 32;
  const W = left * 2 + gap * (n - 1), H = top + rows * fh + 34;
  const X = i => left + i * gap, Y = f => top + (f - base + 0.5) * fh;
  let s = `<svg class="dgm" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} on ${esc(inst.sub)}: ${fr.map(f => f < 0 ? 'muted' : f).join(', ')}">`;
  for (let r = 0; r <= rows; r++) s += `<line class="d-fret" x1="${left}" x2="${X(n - 1)}" y1="${top + r * fh}" y2="${top + r * fh}"/>`;
  if (base === 1) s += `<rect class="d-nut" x="${left - 1}" y="${top - 5}" width="${gap * (n - 1) + 2}" height="6" rx="1"/>`;
  else s += `<text class="d-base" x="${left - 12}" y="${top + fh / 2 + 4}">${base}fr</text>`;
  for (let i = 0; i < n; i++) s += `<line class="d-line" x1="${X(i)}" x2="${X(i)}" y1="${top}" y2="${top + rows * fh}"/>`;
  const fing = fingersFor(fr, v.barre);
  fr.forEach((f, i) => {
    if (f < 0) s += `<text class="d-mark" x="${X(i)}" y="${top - 12}">×</text>`;
    else if (f === 0) s += `<circle class="d-open" cx="${X(i)}" cy="${top - 16}" r="5.5"/>`;
  });
  if (v.barre) { const b = v.barre; s += `<rect class="d-dot" x="${X(b.from) - 12}" y="${Y(b.fret) - 12}" width="${X(b.to) - X(b.from) + 24}" height="24" rx="12"/><text class="d-fn" x="${(X(b.from) + X(b.to)) / 2}" y="${Y(b.fret)}">1</text>`; }
  fr.forEach((f, i) => {
    if (f <= 0) return;
    if (v.barre && f === v.barre.fret && i >= v.barre.from && i <= v.barre.to) return;
    s += `<circle class="d-dot" cx="${X(i)}" cy="${Y(f)}" r="12"/><text class="d-fn" x="${X(i)}" y="${Y(f)}">${fing[i] || ''}</text>`;
  });
  fr.forEach((f, i) => { s += `<text class="d-note" x="${X(i)}" y="${top + rows * fh + 22}">${f < 0 ? '' : esc(pretty(pcName(T[i] + f, flats)))}</text>`; });
  return s + '</svg>';
}
function pianoSVG(v, flats, name) {
  const lit = new Set(v.notes);
  const max = Math.max(...v.notes);
  const oct = Math.max(2, Math.ceil((max + 1) / 12));
  const ww = 24, wh = 92, bw = 15, bh = 58;
  const whites = [0, 2, 4, 5, 7, 9, 11], blacks = [1, 3, 6, 8, 10];
  const W = oct * 7 * ww + 2, H = wh + 4;
  let s = `<svg class="dgm piano" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} on piano">`;
  const lbl = p => esc(pretty(pcName(p, flats)));
  for (let o = 0; o < oct; o++) whites.forEach((pc, k) => {
    const p = o * 12 + pc, x = 1 + (o * 7 + k) * ww;
    const cls = p === v.bass ? 'k-bass' : lit.has(p) ? 'k-on' : 'k-w';
    s += `<rect class="${cls}" x="${x}" y="1" width="${ww}" height="${wh}" rx="3"/>`;
    if (lit.has(p)) s += `<text class="k-lbl" x="${x + ww / 2}" y="${wh - 10}">${lbl(p)}</text>`;
  });
  for (let o = 0; o < oct; o++) blacks.forEach(pc => {
    const p = o * 12 + pc, wi = whites.indexOf(pc - 1), x = 1 + (o * 7 + wi + 1) * ww - bw / 2;
    const cls = p === v.bass ? 'k-bass' : lit.has(p) ? 'k-on' : 'k-b';
    s += `<rect class="${cls}" x="${x}" y="1" width="${bw}" height="${bh}" rx="2"/>`;
    if (lit.has(p)) s += `<text class="k-lbl" x="${x + bw / 2}" y="${bh - 8}" style="font-size:8px">${lbl(p)}</text>`;
  });
  return s + '</svg>';
}

// ---------- sheets ----------
function closeSheet() { S.sheet = null; $('#sheetWrap').hidden = true; $('#sheet').innerHTML = ''; }
function drawSheet() {

function chordSheet() {
  const sh = S.sheet; const ci = chordInfo(sh.c);
  const head = `<div class="sheet-h"><div class="big-chord">${esc(pretty(sh.c))}</div><button class="icon" data-act="closeSheet" aria-label="Close">×</button></div>`;
  if (!ci) return head + `<p class="hint">This isn't a chord name I can draw.</p>`;
  const inst = INST[sh.inst];
  const chips = `<div class="inst" role="group" aria-label="Instrument">${Object.values(INST).map(i => `<button data-act="sheetInst" data-i="${i.id}" aria-pressed="${i.id === sh.inst}">${i.short}</button>`).join('')}</div>`;
  const vs = inst.id === 'piano' ? pianoVoicings(ci) : fretVoicings(ci, inst);
  const flats = ci.flats || (!/#/.test(ci.rootName) && flatsFor(ci.root, /^m(?!aj)/.test(ci.qual)));
  const names = ci.pcs.map(p => pretty(pcName(p, flats)));

  if (!vs.length) return head + chips + `<p class="tuning">${esc(inst.sub)}</p><p class="hint">No comfortable shape found for this chord in this tuning.</p>` + notes;
  const i = ((sh.i % vs.length) + vs.length) % vs.length; const v = vs[i];
  const svg = inst.id === 'piano' ? pianoSVG(v, flats, sh.c) : fretSVG(v, inst, flats, sh.c);
  const label = inst.id === 'piano' ? v.label : `Shape ${i + 1} of ${vs.length}` + (v.minF > 1 ? ` · from fret ${v.minF}` : v.minF === 0 && v.maxF === 0 ? '' : ' · open position');
  const frets = inst.id === 'piano' ? '' : ` · <span title="Frets, low string to high">${v.fr.map(f => f < 0 ? 'x' : f).join(v.fr.some(f => f > 9) ? '-' : '')}</span>`;
  return head + chips + `<p class="tuning">${esc(inst.sub)}${frets}</p><div class="dgm-box">${svg}</div>
    <div class="vnav">${vs.length > 1 ? `<button class="btn" data-act="vstep" data-n="-1" aria-label="Previous shape">‹</button>` : ''}<span>${esc(label)}</span>${vs.length > 1 ? `<button class="btn" data-act="vstep" data-n="1" aria-label="Next shape">›</button>` : ''}</div>` + notes;
}

// ---------- editing helpers ----------
function editBody(fn) { S.draft.body = fn(S.draft.body); renderPreview(); }
function moveChord(dir) {
  const b = S.draft.body, p = S.sel.co;
  const m = b.slice(p).match(/^\[[^\]\n]*\]/); if (!m) return;
  const tag = m[0], w = b.slice(0, p) + b.slice(p + tag.length);
  let np;
  if (dir > 0) {
    if (p >= w.length || w[p] === '\n') return;
    if (w[p] === '[') { const c = w.indexOf(']', p); if (c < 0) return; np = c + 1; } else np = p + 1;
  } else {
    const q = p - 1; if (q < 0 || w[q] === '\n') return;
    if (w[q] === ']') { const o = w.lastIndexOf('[', q); if (o < 0) return; np = o; } else np = q;
  }
  S.draft.body = w.slice(0, np) + tag + w.slice(np); S.sel.co = np; renderPreview();
}
function placeChord(val) {
  const c = val.trim().replace(/[\[\]\n]/g, ''); if (!c) return;
  const sh = S.sheet;
  if (sh.mode === 'chg') {
    const b = S.draft.body; const m = b.slice(sh.o).match(/^\[[^\]\n]*\]/);
    if (m) S.draft.body = b.slice(0, sh.o) + '[' + c + ']' + b.slice(sh.o + m[0].length);
    S.sel = { co: sh.o };
  } else {
    S.draft.body = S.draft.body.slice(0, sh.o) + '[' + c + ']' + S.draft.body.slice(sh.o);
    S.sel = { co: sh.o };
  }

}
// Change the text without moving the page or the text box's own scroll position.
function keepScroll(ta, fn) {
  const top = ta.scrollTop, left = ta.scrollLeft, wy = window.scrollY, wx = window.scrollX;
  fn();
  ta.scrollTop = top; ta.scrollLeft = left; window.scrollTo(wx, wy);
  requestAnimationFrame(() => { ta.scrollTop = top; window.scrollTo(wx, wy); });
}
function setTA(ta, value) { keepScroll(ta, () => { ta.value = value; }); }
function syncTextarea() { const ta = $('#body'); if (ta) S.draft.body = ta.value; }

// ---------- auto-scroll & wake lock ----------
let raf = null, lastT = 0, acc = 0;
function startScroll() {
  S.scrolling = true; lastT = performance.now(); acc = 0;
  const step = t => {
    if (!S.scrolling) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t; acc += S.settings.speed * dt;
    const px = Math.floor(acc); if (px >= 1) { window.scrollBy(0, px); acc -= px; }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) { stopScroll(); render(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function stopScroll() { S.scrolling = false; if (raf) cancelAnimationFrame(raf); raf = null; }
let wl = null;
async function wake(on) {
  try {
    if (on && !wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if (!on && wl) { const w = wl; wl = null; await w.release(); }
  } catch { wl = null; }

  new: ['New', 'Not in your library yet.'],
  newer: ['Changed in the backup', 'The backup has a more recent version than yours.'],
  older: ['Changed here', 'Your version is more recent than the one in the backup.'],
  dup: ['Same title, different song', 'You have a separate song (or setlist) with the same name.']
};
function analyzeImport(data) {
  const plan = { rows: [], same: 0 };
  const scan = (coll, list, map, nameOf, same) => {
    const byName = new Map(); for (const x of map.values()) { const k = normTitle(nameOf(x)); if (k && !byName.has(k)) byName.set(k, x); }
    for (const item of list || []) {
      if (!item || typeof item.id !== 'string' || !ID_OK.test(item.id)) continue;
      const local = map.get(item.id);
      let kind;
      if (local) {
        if (same(local, item)) { plan.same++; continue; }
        kind = (item.updatedAt || 0) > (local.updatedAt || 0) ? 'newer' : 'older';
        plan.rows.push({ coll, kind, item, local, choice: IMP_CHOICES[kind][0][0] });
      } else {
        const twin = byName.get(normTitle(nameOf(item)));
        if (twin) { const identical = same({ ...twin, id: '' }, { ...item, id: '' }); plan.rows.push({ coll, kind: 'dup', item, local: twin, identical, choice: identical ? 'skip' : 'both' }); }
        else plan.rows.push({ coll, kind: 'new', item, local: null, choice: 'add' });
      }
    }
  };
  scan('songs', data.songs, S.songs, x => x.title, sameSong);
  scan('setlists', (data.setlists || []).map(x => ({ ...x, songIds: [...(x.songIds || [])] })), S.setlists, x => x.name, sameSet);
  return plan;
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); if (!data || !Array.isArray(data.songs)) throw 0; }
  catch { toast("That file isn't a MatZ Live backup."); return; }
  const plan = analyzeImport(data);
  if (!plan.rows.length) { toast('Everything in that backup is already here.'); return; }
  S.sheet = { type: 'import', plan, name: file.name || 'backup', busy: false }; drawSheet();
}
const fmtWhen = ts => ts ? new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'unknown time';
function importSheet() {
  const sh = S.sheet, plan = sh.plan;
  const changes = plan.rows.filter(r => !['skip', 'keep'].includes(r.choice)).length;
  let html = `<div class="sheet-h"><h2>Import Library</h2><button class="icon" data-act="closeSheet" aria-label="Close">×</button></div>
    <p class="hint" style="margin:0 0 10px">${esc(sh.name)}. Choose what to do with each item, then import. Nothing changes until you tap Import.${plan.same ? ` ${plan.same} item${plan.same === 1 ? ' is' : 's are'} already identical here and will be left alone.` : ''}</p>
    <div class="imp-list">`;
  for (const kind of ['dup', 'newer', 'older', 'new']) {
    const rows = plan.rows.map((r, i) => ({ r, i })).filter(x => x.r.kind === kind);
    if (!rows.length) continue;
    const [title, sub] = IMP_GROUPS[kind];
    html += `<section class="imp-g"><div class="imp-gh"><div><b>${title}</b> <span class="n">${rows.length}</span><small>${sub}</small></div>
      <div class="imp-all"><span>All:</span>${IMP_CHOICES[kind].map(([v, l]) => `<button class="mini" data-act="impAll" data-k="${kind}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
    for (const { r, i } of rows) {
      const isSet = r.coll === 'setlists';
      const name = isSet ? (r.item.name || 'Untitled setlist') : (r.item.title || 'Untitled');
      let info = isSet ? `Setlist · ${(r.item.songIds || []).length} songs` : r.item.medley ? 'Medley' : (r.item.artist || 'Song');
      if (kind === 'newer' || kind === 'older') info += ` · backup ${fmtWhen(r.item.updatedAt)}, yours ${fmtWhen(r.local.updatedAt)}`;
      if (kind === 'dup') info += r.identical ? ' · identical content' : ` · different content (backup ${fmtWhen(r.item.updatedAt)}, yours ${fmtWhen(r.local.updatedAt)})`;
      html += `<div class="imp-row"><div class="imp-t"><span class="${!isSet && r.item.medley ? 'medley' : ''}">${esc(name)}</span><small>${esc(info)}</small></div>
        <div class="seg-ctl imp-seg">${IMP_CHOICES[kind].map(([v, l]) => `<button data-act="impChoice" data-i="${i}" data-v="${v}" aria-pressed="${r.choice === v}">${l}</button>`).join('')}</div></div>`;
    }
    html += '</section>';
  }
  html += `</div><button class="btn primary" data-act="impGo" style="width:100%;margin-top:12px" ${changes && !sh.busy ? '' : 'disabled'}>${sh.busy ? 'Importing…' : changes ? `Import ${changes} change${changes === 1 ? '' : 's'}` : 'Nothing selected to import'}</button>`;
  return html;
}
async function runImport() {
  const sh = S.sheet, plan = sh.plan;
  // Songs first: work out which local song each incoming id should point to, so setlists and medleys stay linked.
  const idMap = {};
  for (const r of plan.rows) if (r.coll === 'songs' && r.kind === 'dup' && (r.choice === 'skip' || r.choice === 'replaceMine')) idMap[r.item.id] = r.local.id;
  const mapIds = ids => (ids || []).map(id => idMap[id] || id);
  const now = Date.now(); const writes = [];
  for (const r of plan.rows) {
    if (r.choice === 'skip' || r.choice === 'keep') continue;
    let item = { ...r.item };
    if (r.coll === 'songs' && item.medley) item.medley = item.medley.map(p => ({ ...p, id: idMap[p.id] || p.id }));
    if (r.coll === 'setlists') item.songIds = mapIds(item.songIds);
    if (r.choice === 'replaceMine') item = { ...item, id: r.local.id, updatedAt: now };
    else if (r.choice === 'both' && r.kind !== 'dup') {   // same item in both: the backup's version becomes a separate copy
      item = { ...item, id: uid(), createdAt: now };
      if (r.coll === 'songs') item.title = (item.title || 'Untitled') + ' (from backup)'; else item.name = (item.name || 'Untitled setlist') + ' (from backup)';
    }
    else if (r.choice === 'replace' && r.kind === 'older') item.updatedAt = now;   // chosen over a newer version: make it the latest
    writes.push([r.coll, item]);
  }
  for (const [coll, item] of writes) {
    if (db) { const { id, ...rest } = item; await withRetry(() => db.collection(coll).doc(id).set({ ...rest, updatedAt: item.updatedAt || now })); }
    (coll === 'songs' ? S.songs : S.setlists).set(item.id, item);
  }
  if (!db) local.save();
  const nS = writes.filter(w => w[0] === 'songs').length, nL = writes.length - nS;
  return `Imported ${nS} song${nS === 1 ? '' : 's'}${nL ? ` and ${nL} setlist${nL === 1 ? '' : 's'}` : ''}.`;
}
document.addEventListener('change', e => {
  if (e.target.dataset.ch === 'import') { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; return; }
  if (e.target.dataset.ch === 'slname') { const sl = S.setlists.get(cur().id); if (sl) safe(() => put('setlists', { ...sl, name: e.target.value.trim() || 'Untitled setlist' })); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

init();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
